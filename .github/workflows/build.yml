name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # --- Linux system dependencies for Tauri (webkit2gtk etc.) ---
      - name: Install Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # --- Java: build the sidecar fat-jar ---
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build sidecar jar
        working-directory: sidecar
        run: mvn -B -DskipTests package

      # --- Create a trimmed JRE with jlink so users don't need Java installed ---
      - name: Build bundled JRE (jlink)
        shell: bash
        run: |
          rm -rf frontend/src-tauri/runtime
          # Determine modules the sidecar needs; fall back to a broad safe set.
          MODS=$(jdeps --print-module-deps --ignore-missing-deps --multi-release 17 \
            sidecar/target/multiclouddb-explorer-sidecar.jar 2>/dev/null || true)
          if [ -z "$MODS" ]; then
            MODS="java.base,java.logging,java.naming,java.net.http,java.sql,java.xml,jdk.crypto.ec,java.security.jgss,java.management,java.desktop"
          else
            # Ensure TLS + common runtime modules are present.
            MODS="$MODS,jdk.crypto.ec,java.net.http"
          fi
          echo "jlink modules: $MODS"
          jlink --no-header-files --no-man-pages --strip-debug --compress=2 \
            --add-modules "$MODS" \
            --output frontend/src-tauri/runtime
          frontend/src-tauri/runtime/bin/java -version

      # --- Node: build the frontend ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # --- Rust toolchain ---
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # --- Build installers via the Tauri action, and publish a Release ---
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: frontend
          # Linux: ship .deb + .rpm only. AppImage bundling fails when a JRE is
          # embedded (linuxdeploy can't resolve the bundled .so set). deb/rpm
          # cover the target audience and the install script prefers .deb.
          args: ${{ matrix.target == 'linux' && '--bundles deb,rpm' || '' }}
          # On a version tag, create/append to a GitHub Release and upload the
          # installers as assets. The install scripts read the 'latest' release.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Also keep installers as workflow artifacts (for manual runs) ---
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            frontend/src-tauri/target/release/bundle/**/*.msi
            frontend/src-tauri/target/release/bundle/**/*.exe
            frontend/src-tauri/target/release/bundle/**/*.dmg
            frontend/src-tauri/target/release/bundle/**/*.deb
            frontend/src-tauri/target/release/bundle/**/*.rpm
