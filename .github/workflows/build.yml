name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # --- Linux system dependencies for Tauri (webkit2gtk etc.) ---
      - name: Install Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # --- Java: build the sidecar fat-jar ---
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build sidecar jar
        working-directory: sidecar
        run: mvn -B -DskipTests package

      # --- Create a trimmed JRE with jlink so users don't need Java installed ---
      - name: Build bundled JRE (jlink)
        shell: bash
        run: |
          rm -rf frontend/src-tauri/runtime
          # jdeps can't see reflection/service-loaded dependencies (Jackson,
          # cloud SDKs, TLS, etc.), so we union its result with a comprehensive
          # safe set rather than trusting auto-detection alone. A too-small JRE
          # makes the sidecar crash on startup ('exited before handshake').
          BASE="java.base,java.logging,java.naming,java.net.http,java.sql,java.xml,java.desktop,java.management,java.security.jgss,java.security.sasl,java.instrument,java.compiler,java.transaction.xa,java.rmi,java.scripting,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.httpserver,jdk.unsupported,jdk.management,jdk.naming.dns,jdk.zipfs,jdk.jdwp.agent"
          DETECTED=$(jdeps --print-module-deps --ignore-missing-deps --multi-release 17 \
            sidecar/target/multiclouddb-explorer-sidecar.jar 2>/dev/null || true)
          MODS=$(printf '%s,%s' "$BASE" "$DETECTED" | tr ',' '\n' | sed '/^$/d' | sort -u | paste -sd, -)
          echo "jlink modules: $MODS"
          jlink --no-header-files --no-man-pages --strip-debug --compress=2 \
            --add-modules "$MODS" \
            --output frontend/src-tauri/runtime
          frontend/src-tauri/runtime/bin/java -version
          # Smoke-test: the sidecar must reach its handshake under this JRE.
          echo "Smoke-testing sidecar under bundled JRE..."
          timeout 30 frontend/src-tauri/runtime/bin/java -jar \
            sidecar/target/multiclouddb-explorer-sidecar.jar --port 0 > sc.log 2>&1 &
          SC=$!
          for i in $(seq 1 25); do
            if grep -q 'SIDECAR_READY' sc.log 2>/dev/null; then echo "handshake OK"; break; fi
            if ! kill -0 $SC 2>/dev/null; then echo "SIDECAR CRASHED:"; cat sc.log; exit 1; fi
            sleep 1
          done
          grep -q 'SIDECAR_READY' sc.log || { echo "NO HANDSHAKE:"; cat sc.log; kill $SC 2>/dev/null; exit 1; }
          kill $SC 2>/dev/null || true

      # --- Node: build the frontend ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # --- Rust toolchain ---
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # --- Build installers via the Tauri action, and publish a Release ---
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: frontend
          # Linux: ship .deb + .rpm only. AppImage bundling fails when a JRE is
          # embedded (linuxdeploy can't resolve the bundled .so set). deb/rpm
          # cover the target audience and the install script prefers .deb.
          args: ${{ matrix.target == 'linux' && '--bundles deb,rpm' || '' }}
          # On a version tag, create/append to a GitHub Release and upload the
          # installers as assets. The install scripts read the 'latest' release.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Also keep installers as workflow artifacts (for manual runs) ---
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            frontend/src-tauri/target/release/bundle/**/*.msi
            frontend/src-tauri/target/release/bundle/**/*.exe
            frontend/src-tauri/target/release/bundle/**/*.dmg
            frontend/src-tauri/target/release/bundle/**/*.deb
            frontend/src-tauri/target/release/bundle/**/*.rpm
